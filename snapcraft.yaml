---
name: audex
confinement: strict
grade: stable
base: core24
adopt-info: audex
apps:
  audex:
    extensions:
      - kde-neon-6
    common-id: org.kde.audex.desktop
    desktop: usr/share/applications/org.kde.audex.desktop
    command: usr/bin/audex
    plugs:
      - audio-record
      - home
      - optical-drive
      - system-backup
      - mount-observe
      - hardware-observe
      - raw-usb
      - removable-media
    environment:
      QT_PLUGIN_PATH: "$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/plugins/snap/kf6-core24/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/plugins"
      QML_IMPORT_PATH: "$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml:/snap/kf6-core24/current/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qml"
      ALSA_CONFIG_PATH: "$SNAP/kf6/etc/asound.conf"
layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
slots:
  session-dbus-interface:
    interface: dbus
    name: org.kde.audex
    bus: session
parts:
  # Ubuntu 24.04 (core24) ships TagLib 1.13 without CMake config; Audex needs
  # TagLib >= 1.12 with its CMake package config, so build TagLib 2.x like the
  # Flatpak does. utf8cpp is a hard dependency of TagLib 2.x.
  utfcpp:
    plugin: cmake
    source: https://github.com/nemtrif/utfcpp/archive/refs/tags/v4.2.1.tar.gz
    source-checksum: sha256/6d6a5493a111884cc085ee31babfe6d9960c8fb08fc80a64852eaeea8323dbc1
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DUTF8_TESTS=OFF
      - -DUTF8_SAMPLES=OFF
  taglib:
    after:
      - utfcpp
    plugin: cmake
    source: https://taglib.org/releases/taglib-2.1.tar.gz
    source-checksum: sha256/95b788b39eaebab41f7e6d1c1d05ceee01a5d1225e4b6d11ed8976e96ba90b0c
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_BINDINGS=OFF
  audex:
    after:
      - taglib
    parse-info:
      - usr/share/metainfo/org.kde.audex.metainfo.xml
    plugin: cmake
    build-snaps:
      - kde-qt6-core24-sdk/latest/beta
      - kf6-core24-sdk/latest/beta
    build-packages:
      - libxkbcommon-dev
      - libflac-dev
      - libopusenc-dev
      - libmp3lame-dev
      - libpulse0
      - libxml2-dev
      - gettext
      - doxygen
      - graphviz
      - libxml2-utils
      - docbook-xml
      - docbook-xsl
      - libglx-dev
      - libgl-dev
      - libglvnd-dev
    stage-packages:
      - libpulse0
      - libasound2
      - libasound2-plugins
      - libasound2-data
      - flac
      - lame
      - opus-tools
      - vorbis-tools
      - faac
      - libxkbcommon0
      - libaudio2
      - libflac12t64
      - libopusenc0
      - libmp3lame0
    source: .
    source-type: local
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DQT_MAJOR_VERSION=6
      - -DBUILD_TESTING=OFF
    prime:
      - -usr/lib/*/cmake/*
      - -usr/include/*
      - -usr/share/ECM/*
      - -usr/share/man/*
      - -usr/bin/X11
      - -usr/lib/gcc/$CRAFT_ARCH_TRIPLET_BUILD_FOR/6.0.0
      - -usr/lib/aspell/*
      - -usr/share/lintian
  cleanup:
    after:
      - audex
    plugin: nil
    build-snaps:
      - core24
      - kf6-core24
    override-prime: |
      set -eux
      for snap in "core24" "kf6-core24"; do
          cd "/snap/$snap/current" && find . -type f,l -exec rm -rf "${CRAFT_PRIME}/{}" \;
      done
